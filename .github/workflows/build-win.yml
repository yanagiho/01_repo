name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-win:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: MangaCatch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MangaCatch/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Build Windows EXE (portable)
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaCatch-Windows-x64
          path: MangaCatch/release/*.exe
          retention-days: 7
